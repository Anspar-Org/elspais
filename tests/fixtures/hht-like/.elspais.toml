# HHT-Diary style configuration
# This fixture matches the hht-diary repository structure

version = 5

[project]
name = "hht-like-fixture"
namespace = "REQ"

[levels.prd]
rank = 1
letter = "p"
implements = ["prd"]

[levels.ops]
rank = 2
letter = "o"
implements = ["prd"]

[levels.dev]
rank = 3
letter = "d"
implements = ["ops", "prd"]

[id-patterns]
canonical = "{namespace}-{level.letter}{component}"

[id-patterns.aliases]
short = "{level.letter}{component}"

[id-patterns.component]
style = "numeric"
digits = 5
leading_zeros = true

[scanning]
skip = ["node_modules", ".git", "build", "dist"]

[scanning.spec]
directories = ["spec"]
index_file = "INDEX.md"
skip_files = ["README.md", "requirements-format.md", "INDEX.md"]

[scanning.code]
# A pattern selects within the directories this kind declares, so every
# directory holding scannable code is named here and the patterns say only
# which files inside them count (REQ-d00212-W).
directories = ["apps", "packages", "server", "tools", "database"]
file_patterns = ["*.sql", "*.dart"]

[scanning.test]
enabled = true
directories = ["tests"]
file_patterns = ["test_*.py", "*_test.py"]

[scanning.journey]
directories = ["spec"]

[rules.hierarchy]
allow_circular = false
allow_structural_orphans = false

[rules.format]
require_hash = true
require_rationale = false
require_assertions = true
require_status = true

[validation]
strict_hierarchy = true
hash_algorithm = "sha256"
hash_length = 8

[terms]
output_dir = "spec/_generated"
markup_styles = ["*", "**"]

[terms.severity]
duplicate = "error"
undefined = "warning"
unmarked = "warning"
unused = "warning"
bad_definition = "error"
collection_empty = "warning"

# A named scope, so a report can be asked for by the audience it is for.
[scopes.board]
level = ["prd"]
status = ["Active"]
