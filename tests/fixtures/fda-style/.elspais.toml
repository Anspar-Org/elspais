# FDA-style configuration
# Uses PRD-00001, OPS-00001, DEV-00001 format

version = 5

[project]
name = "fda-style-fixture"
namespace = "FDA"

[levels.PRD]
letter = "P"
rank = 1
implements = ["PRD"]

[levels.OPS]
letter = "O"
rank = 2
implements = ["PRD"]

[levels.DEV]
letter = "D"
rank = 3
implements = ["OPS", "PRD"]

[levels.TST]
letter = "T"
rank = 3
implements = ["DEV", "PRD"]

[id-patterns]
canonical = "{type}-{component}"

[id-patterns.component]
style = "numeric"
digits = 5
leading_zeros = true

[scanning.spec]
directories = ["spec"]
