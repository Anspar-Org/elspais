# Implements: REQ-o00066-B+C+D+E+I+J+L+M+O
name: CI

# Every job runs on the one Python the project supports.
#
# A pull request runs CI whatever branch it targets, so a pull request stacked
# on another one's branch is tested too (REQ-o00066-L,
# docs/stacked-pull-requests.md). `merge_group` is the merge queue: it tests
# the commit that will actually land, with the checks a pull request into main
# gets (REQ-o00066-M). Path-filtered tiers always run there, because the queue
# is the last gate before main.
#
# The `plan` job decides whether a run is FULL. A full run executes every
# tier with no path filter. Any other run executes only the unit tests Test
# Impact Analysis selects (REQ-o00066-I+O, docs/test-impact-analysis.md).
# A run is full where:
#   - the pull request carries the label `publish` or `baseline` -- for a push
#     to main, the pull request that was merged;
#   - the daily schedule finds no recorded full run of main's newest commit;
#   - a person dispatches the workflow;
#   - the release calls it (`workflow_call`) for a commit no full push run
#     passed (REQ-o00066-N). A called run takes its caller's event, so
#     `inputs.ref` is what marks it, and each checkout is at `inputs.ref`.
# A full run of main records the TIA baseline that later runs, and developers'
# hooks, select from. A called run records no baseline and promotes no image.
# A push to main that is not full runs no e2e, stress or browser tier: the
# pull request ran them, and the next full run of main runs them again.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to test, with the full suite a push to main runs'
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/anspar-org/elspais-ci

jobs:
  plan:
    # Decides whether this run is full (see the header). Labels are read
    # through the API rather than from the event, so a re-run reads the
    # labels the pull request carries now.
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.mode.outputs.full }}
      skip: ${{ steps.mode.outputs.skip }}
      record: ${{ steps.mode.outputs.record }}
    steps:
      - name: Look for a recorded full run of this commit
        id: recorded
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .results/tia/baseline
          key: tia-baseline-v2-py3.14-${{ github.sha }}
          lookup-only: true

      - name: Choose full or impacted
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_INPUT: ${{ inputs.ref }}
          GIT_REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          RECORDED: ${{ steps.recorded.outputs.cache-hit }}
        run: |
          labels=""
          case "$EVENT" in
            pull_request)
              labels=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name') ;;
            merge_group)
              # gh-readonly-queue/<base>/pr-<number>-<sha>
              number=$(printf '%s' "$QUEUE_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')
              if [ -n "$number" ]; then
                labels=$(gh api "repos/${REPOSITORY}/issues/${number}/labels" --jq '.[].name')
              fi ;;
            push)
              labels=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" --jq '.[].labels[].name') ;;
          esac
          full=false
          skip=false
          if [ -n "$REF_INPUT" ]; then
            full=true; why="the release tests ${REF_INPUT}"
          elif [ "$EVENT" = "schedule" ]; then
            if [ "$RECORDED" = "true" ]; then
              skip=true; why="a full run of ${SHA} is already recorded"
            else
              full=true; why="the daily run found no full run of ${SHA}"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            full=true; why="dispatched by hand"
          elif printf '%s\n' "$labels" | grep -qx -E 'publish|baseline'; then
            full=true; why="labelled $(printf '%s' "$labels" | grep -x -E 'publish|baseline' | paste -sd, -)"
          else
            why="no label asks for the full suite"
          fi
          # Only a full run of main records a baseline: its tree is the one
          # later changes are diffed against.
          record=false
          if [ "$full" = "true" ] && [ -z "$REF_INPUT" ] && [ "$GIT_REF" = "refs/heads/main" ] \
            && [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; then
            record=true
          fi
          {
            echo "full=${full}"
            echo "skip=${skip}"
            echo "record=${record}"
          } >> "$GITHUB_OUTPUT"
          echo "full=${full} skip=${skip} record=${record}: ${why}"

  compute-hash:
    name: Compute Dockerfile Hash
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Compute Dockerfile hash
        id: hash
        run: |
          HASH=$(sha256sum .github/docker/Dockerfile | cut -c1-7)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

  prepare-image:
    name: Prepare CI Image (Python ${{ matrix.python-version }})
    needs: compute-hash
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if candidate image exists
        id: check
        run: |
          TAG="py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}"
          if docker manifest inspect "${{ env.IMAGE_BASE }}:${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $TAG already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $TAG not found, will build"
          fi

      - name: Build and push candidate image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          tags: ${{ env.IMAGE_BASE }}:py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}

  test:
    # The unit tier. A full run executes all of it; any other run executes
    # only the tests Test Impact Analysis selects from the newest baseline a
    # full run of main recorded, which falls back to the full tier whenever it
    # cannot determine impact (no baseline, a changed environment, a
    # broad-impact file, ...).
    name: Test (Python ${{ matrix.python-version }})
    needs: [plan, compute-hash, prepare-image]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/anspar-org/elspais-ci:py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    env:
      # The cache steps below save and restore this directory.
      ELSPAIS_TIA_BASELINE: .results/tia/baseline

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # A selection diffs the baseline's tree, a commit on main, against
          # this one.
          fetch-depth: ${{ needs.plan.outputs.full == 'true' && 1 || 0 }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The extras and the lock `make setup` installs: a baseline selects only
      # in an environment where every installed distribution matches it
      # (docs/test-impact-analysis.md).
      - name: Install package with dev dependencies
        run: pip install -c requirements/dev.lock -e ".[dev,all,browser]"

      - name: Restore the newest baseline of main
        if: needs.plan.outputs.full != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .results/tia/baseline
          key: tia-baseline-v2-py3.14-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          restore-keys: tia-baseline-v2-py3.14-

      - name: Run the impacted unit tests
        if: needs.plan.outputs.full != 'true'
        run: python -m tools.tia run --out .results/tia/run

      - name: Upload the selection manifest
        if: ${{ !cancelled() && needs.plan.outputs.full != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tia-manifest
          path: |
            .results/tia/run/manifest.json
            .results/tia/run/junit.xml
          if-no-files-found: warn

      # Recording does not change the tier: same tests, same verdict. The
      # baseline is published only from a run that passed.
      - name: Run the full unit tier
        if: needs.plan.outputs.full == 'true'
        env:
          ELSPAIS_TIA_RECORD: ${{ needs.plan.outputs.record == 'true' && '1' || '' }}
        run: .githooks/run-unit-tier .results/elspais-unit

      - name: Save the baseline for later runs
        if: ${{ !cancelled() && needs.plan.outputs.record == 'true' && hashFiles('.results/tia/baseline/baseline.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .results/tia/baseline
          key: tia-baseline-v2-py3.14-${{ github.sha }}

      # `python -m tools.tia baseline fetch` downloads this artifact into a
      # developer's worktree. The cache above is out of reach outside Actions.
      - name: Publish the baseline for developers
        if: ${{ !cancelled() && needs.plan.outputs.record == 'true' && hashFiles('.results/tia/baseline/baseline.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tia-baseline-${{ github.sha }}
          path: .results/tia/baseline
          retention-days: 30
          if-no-files-found: error

  e2e-test:
    # The e2e tier, run the way the pre-push hook runs it: through
    # .githooks/run-e2e-tier, which spawns the real `elspais` program for every
    # CLI, MCP and viewer path. It covers the CLI broadly, so it runs on every
    # change rather than behind a path filter. Browser tests carrying the e2e
    # marker run here too, so the browser extra and chromium are installed.
    # A push to main runs it only when the run is full.
    name: E2E (Python ${{ matrix.python-version }})
    needs: [plan, compute-hash, prepare-image]
    if: needs.plan.outputs.skip != 'true' && (github.event_name != 'push' || needs.plan.outputs.full == 'true')
    runs-on: ubuntu-latest
    container: ghcr.io/anspar-org/elspais-ci:py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install package with e2e test dependencies
        run: pip install -c requirements/dev.lock -e ".[dev,all,browser]"

      - name: Install chromium
        run: playwright install --with-deps chromium

      - name: Run e2e tier
        run: .githooks/run-e2e-tier .results/elspais-e2e

  stress-test:
    # Concurrency stress battery (pytest -m stress): races live daemon
    # surfaces with barrier-released writer threads. A pull request runs it
    # only when the change can affect the concurrency machinery -- the
    # guard/lock/shared-state code paths -- so unrelated pull requests don't
    # pay for it. A merge-queue candidate and a full run always run it. A
    # push to main runs it only when the run is full.
    name: Concurrency Stress (Python ${{ matrix.python-version }})
    needs: [plan, compute-hash, prepare-image]
    if: needs.plan.outputs.skip != 'true' && (github.event_name != 'push' || needs.plan.outputs.full == 'true')
    runs-on: ubuntu-latest
    container: ghcr.io/anspar-org/elspais-ci:py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect concurrency-relevant changes
        id: filter
        if: github.event_name == 'pull_request' && !inputs.ref && needs.plan.outputs.full != 'true'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            concurrency:
              - 'src/elspais/mcp/**'
              - 'src/elspais/server/**'
              - 'src/elspais/graph/**'
              - 'tests/stress/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Install package with dev dependencies
        if: steps.filter.outputs.concurrency == 'true' || github.event_name != 'pull_request' || inputs.ref || needs.plan.outputs.full == 'true'
        run: pip install -c requirements/dev.lock -e ".[dev,all,browser]"

      - name: Run concurrency stress battery
        if: steps.filter.outputs.concurrency == 'true' || github.event_name != 'pull_request' || inputs.ref || needs.plan.outputs.full == 'true'
        run: pytest tests/stress -m stress --tb=short -q

      - name: Skipped (no concurrency-relevant changes)
        if: github.event_name == 'pull_request' && !inputs.ref && needs.plan.outputs.full != 'true' && steps.filter.outputs.concurrency != 'true'
        run: echo "No concurrency-relevant files changed; stress battery not required."

  browser-test:
    # Playwright viewer tier (pytest -m browser). Kept off the main test job
    # because it needs a browser binary the CI image does not carry. A pull
    # request runs it only when the change can reach what the viewer renders.
    # A merge-queue candidate and a full run always run it. A push to main
    # runs it only when the run is full.
    #
    # This tier reported green for its whole life without running: the module
    # opens with `pytest.importorskip("playwright")`, no install path reached
    # the `browser` extra (it is deliberately absent from `all`, which is a
    # user-facing feature set, not a test one), and nothing invoked the marker.
    # tests/conftest.py now errors when the marker is asked for and the extra
    # is missing, so a run that cannot honour the request says so.
    name: Viewer Browser Tier (Python ${{ matrix.python-version }})
    needs: [plan, compute-hash, prepare-image]
    if: needs.plan.outputs.skip != 'true' && (github.event_name != 'push' || needs.plan.outputs.full == 'true')
    runs-on: ubuntu-latest
    container: ghcr.io/anspar-org/elspais-ci:py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect viewer-relevant changes
        id: filter
        if: github.event_name == 'pull_request' && !inputs.ref && needs.plan.outputs.full != 'true'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            viewer:
              - 'src/elspais/html/**'
              - 'src/elspais/server/**'
              - 'src/elspais/commands/viewer*.py'
              - 'tests/e2e/viewer_browser/**'
              - 'tests/conftest.py'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

      - name: Install package with browser test dependencies
        if: steps.filter.outputs.viewer == 'true' || github.event_name != 'pull_request' || inputs.ref || needs.plan.outputs.full == 'true'
        run: pip install -c requirements/dev.lock -e ".[dev,all,browser]"

      - name: Install chromium
        if: steps.filter.outputs.viewer == 'true' || github.event_name != 'pull_request' || inputs.ref || needs.plan.outputs.full == 'true'
        run: playwright install --with-deps chromium

      - name: Run viewer browser tier
        if: steps.filter.outputs.viewer == 'true' || github.event_name != 'pull_request' || inputs.ref || needs.plan.outputs.full == 'true'
        run: pytest -m browser --tb=short -q

      - name: Skipped (no viewer-relevant changes)
        if: github.event_name == 'pull_request' && !inputs.ref && needs.plan.outputs.full != 'true' && steps.filter.outputs.viewer != 'true'
        run: echo "No viewer-relevant files changed; browser tier not required."

  full-suite:
    # Succeeds only in a full run whose every tier passed. The release gate
    # reads a push run as a verdict on its commit only where this job passed
    # (REQ-o00066-N); in any other run it is skipped.
    name: Full Suite
    needs: [plan, test, e2e-test, stress-test, browser-test]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Every tier ran in full and passed."

  promote-image:
    name: Promote CI Image (Python ${{ matrix.python-version }})
    needs: [compute-hash, full-suite]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && !inputs.ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
          sudo mv crane /usr/local/bin/

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote candidate to production tag
        run: |
          CANDIDATE="py${{ matrix.python-version }}-sha-${{ needs.compute-hash.outputs.hash }}"
          PRODUCTION="py${{ matrix.python-version }}"
          echo "Promoting $CANDIDATE -> $PRODUCTION"
          crane tag "${{ env.IMAGE_BASE }}:${CANDIDATE}" "${PRODUCTION}"

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Before the install: a pyproject.toml change the lock does not carry
      # can make the constrained install fail, and this names the remedy.
      - name: Check the dependency lock is current
        run: |
          make lock PY=python
          if ! git diff --exit-code -- requirements/dev.lock; then
            echo "::error file=requirements/dev.lock::requirements/dev.lock is out of date with pyproject.toml. Run 'make lock' and commit the result."
            exit 1
          fi

      - name: Install dev dependencies
        run: pip install -c requirements/dev.lock -e ".[dev]"

      - name: Check with ruff
        run: ruff check src/ tests/ tools/

      # Implements: REQ-o00066-H
      # Formatting is enforced here and not only by the pre-commit hook: the
      # hook is absent from a fresh clone until `core.hooksPath` is set, it
      # can be bypassed, and it never runs for a commit created on the forge
      # (an automated version bump, or an edit accepted through the web).
      # Whatever reaches main unformatted is then inherited by whoever next
      # commits, because the hook checks the whole tree.
      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ tools/

  self-validate:
    name: Self-Validate Specs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install elspais
        run: pip install -c requirements/dev.lock -e .

      - name: Run health checks on specs
        # --lenient so the missing-test-results warning (which now flips
        # exit code under default mode) doesn't fail self-validate.
        # This step intentionally does not run tests; coverage/staleness
        # are evaluated by separate test jobs.
        run: elspais checks --lenient

      - name: Generate traceability matrix
        run: |
          mkdir -p build-reports
          elspais trace --format markdown --output build-reports/traceability_matrix.md
          elspais trace --format json --output build-reports/traceability_matrix.json

      - name: Upload traceability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-${{ inputs.ref || github.sha }}
          path: build-reports/
          retention-days: 30

  security:
    name: Security Scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown --exclude-detectors=lob
          # Lob (postal-mail API) keys are `test_` followed by exactly 35
          # characters, which is also the shape of a great many pytest
          # function names -- 178 in this repo match it exactly. Lob's API
          # accepts any well-formed test-mode key, so such a name is reported
          # as a *verified* secret and fails the scan. This project has no Lob
          # integration and no reason to hold a Lob key, so the detector can
          # only produce false positives here. Every other detector stays on.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: pip install -c requirements/dev.lock -e ".[all]"

      # The audit tools install under the lock too, so a dependency they share
      # with the project stays at the version the lock pins and is audited there.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install -c requirements/dev.lock pip-audit
          pip-audit \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-3219
          # CVE-2026-4539: ReDoS in pygments AdlLexer, no fix available
          # CVE-2026-3219: vulnerability in pip 26.0.1, no fix available

      - name: Check with safety
        run: |
          pip install -c requirements/dev.lock safety
          safety check
        continue-on-error: true
