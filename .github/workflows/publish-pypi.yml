# Implements: REQ-o00078-A+B+C
# The Homebrew half of REQ-o00078 is carried by the tap repository, which
# this graph does not index; only the index channel's evidence lives here.
name: Publish to PyPI & Update Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_pypi:
        description: 'Skip PyPI upload (just update Homebrew)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (without v prefix)'
        type: string
        required: true
      sha:
        description: 'Commit to publish'
        type: string
        required: true
      skip_pypi:
        description: 'Skip PyPI upload (just update Homebrew)'
        type: boolean
        default: false

jobs:

  # Implements: REQ-o00066-N
  # Every channel publishes the commit this job resolves, and only once the
  # full test suite has passed on exactly that commit: in a full CI push run
  # on main, or else in the `tests` job below. A
  # release a person creates by hand meets the same gate as an automatic one.
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      verdict: ${{ steps.verdict.outputs.verdict }}

    steps:
      - name: Resolve the commit being published
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          # A called run carries its caller's event and sha, so the caller
          # names the commit; a release names its tag; a dispatch names its ref.
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
            VERSION="$INPUT_VERSION"
            SOURCE="the calling workflow"
          elif [ "$EVENT" = "release" ]; then
            SHA=$(gh api "repos/${REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')
            VERSION="${RELEASE_TAG#v}"
            SOURCE="release tag ${RELEASE_TAG}"
          else
            SHA="$DISPATCH_SHA"
            VERSION=""
            SOURCE="the dispatched ref ${GITHUB_REF}"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve the commit to publish from ${SOURCE}"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pending_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${SHA}, resolved from ${SOURCE}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Confirm the version the commit declares
        id: version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          EXPECTED: ${{ steps.commit.outputs.pending_version }}
        run: |
          DECLARED=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$DECLARED" ]; then
            echo "::error::pyproject.toml at ${SHA} declares no version"
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$DECLARED" ]; then
            echo "::error::Refusing to publish ${SHA}: it declares version ${DECLARED}, but the release names ${EXPECTED}"
            exit 1
          fi
          echo "version=${DECLARED}" >> "$GITHUB_OUTPUT"

      # A completed push run whose every job passed, `Full Suite` among
      # them, is the verdict, and a failed job in one is a verdict too.
      # Anything else -- no push run, one in progress, cancelled, or one that
      # ran only the impacted unit tests and so skipped `Full Suite` -- is no
      # verdict at all, so the release runs the suite itself.
      - name: Read CI's verdict on this commit
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          RUNS=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --event push --limit 20 --json databaseId,status,conclusion)
          PASSED_RUN=""
          FAILED=""
          FOUND=""
          for ID in $(echo "$RUNS" | jq -r '.[].databaseId'); do
            STATUS=$(echo "$RUNS" | jq -r --argjson id "$ID" '.[] | select(.databaseId == $id) | .status')
            FOUND="${FOUND}${FOUND:+, }run ${ID} ${STATUS}"
            if [ "$STATUS" != "completed" ]; then
              continue
            fi
            JOBS=$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${ID}/jobs?per_page=100" \
              --jq '.jobs[] | "\(.conclusion // "none")\t\(.name)"')
            if [ -z "$JOBS" ]; then
              continue
            fi
            FAILING=$(printf '%s\n' "$JOBS" | awk -F'\t' '$1 == "failure" || $1 == "timed_out" { print $2 }' | paste -sd ';' -)
            NOT_PASSED=$(printf '%s\n' "$JOBS" | awk -F'\t' '$1 != "success" { print $2 ": " $1 }' | paste -sd ';' -)
            if [ -n "$FAILING" ]; then
              FAILED="${FAILED}${FAILED:+; }run ${ID} failed in ${FAILING}"
            elif [ -z "$NOT_PASSED" ] && printf '%s\n' "$JOBS" | grep -qx "$(printf 'success\tFull Suite')"; then
              PASSED_RUN="$ID"
            else
              FOUND="${FOUND} (${NOT_PASSED})"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Refusing to publish ${SHA}: CI's push run failed on this commit (${FAILED}). Fix the failure and release a commit that passes."
            exit 1
          fi
          if [ -n "$PASSED_RUN" ]; then
            echo "CI push run ${PASSED_RUN} passed every job on ${SHA}; publishing without a further run"
            echo "verdict=passed" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CI push run has passed or failed on ${SHA} (found: ${FOUND:-no push run}); the release runs the full suite on it"
            echo "verdict=untested" >> "$GITHUB_OUTPUT"
          fi

  # Implements: REQ-o00066-N
  # The full suite a full push run executes, on the commit being published,
  # for a commit CI holds no verdict on. Every checkout in it is at that
  # commit.
  tests:
    name: Release Tests
    needs: [gate]
    if: needs.gate.outputs.verdict == 'untested'
    permissions:
      contents: read
      packages: write  # the suite builds its CI image when none exists yet
      pull-requests: read  # CI's plan job reads labels; a called run ignores them
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  # Implements: REQ-o00066-N
  # `tests` is skipped when CI already passed the commit, and a skipped need
  # would skip this job, so the condition names both ways to proceed.
  publish:
    runs-on: ubuntu-latest
    needs: [gate, tests]
    if: >-
      !cancelled() && !inputs.skip_pypi && needs.gate.result == 'success' &&
      (needs.gate.outputs.verdict == 'passed' || needs.tests.result == 'success')
    permissions:
      id-token: write  # for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [gate, tests, publish]
    # A skip_pypi run skips `publish` and still reaches the tap, so the test
    # verdict is required here as well.
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (needs.gate.outputs.verdict == 'passed' || needs.tests.result == 'success') &&
      (needs.publish.result == 'success' || inputs.skip_pypi)

    steps:
      - name: Find triggering PR author
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          if ! AUTHOR=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" --jq '.[0].user.login // empty'); then
            echo "::warning::Pull request lookup for ${SHA} failed (tolerated: the author falls back to the actor)"
            AUTHOR=""
          fi
          echo "login=${AUTHOR:-${{ github.actor }}}" >> "$GITHUB_OUTPUT"

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: Anspar-Org/homebrew-anspar
          event-type: update-formula
          client-payload: '{"package": "elspais", "version": "${{ needs.gate.outputs.version }}", "author": "${{ steps.author.outputs.login }}"}'

  notify-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [gate, publish, update-homebrew]
    # Fires whenever PyPI publish succeeded, regardless of the Homebrew
    # dispatch result. A Homebrew failure is reported separately via the
    # author DM in notify-failure; gating #dev on both would silence the
    # PyPI announcement on partial-success runs.
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read

    steps:
      # Required for slack-notify (reads .github/slack-channels.yml).
      - uses: actions/checkout@v4

      - name: Find triggering PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          if ! PR_JSON=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" --jq '.[0] // empty'); then
            echo "::warning::Pull request lookup for ${SHA} failed (tolerated: the message omits the pull request)"
            PR_JSON=""
          fi

          if [ -n "$PR_JSON" ]; then
            {
              echo "number=$(echo "$PR_JSON" | jq -r '.number')"
              echo "title=$(echo "$PR_JSON" | jq -r '.title')"
              echo "url=$(echo "$PR_JSON" | jq -r '.html_url')"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build success message
        id: message
        env:
          PR_FOUND: ${{ steps.pr.outputs.found }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
          VERSION: ${{ needs.gate.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          PUBLISHED="<https://pypi.org/project/elspais/${VERSION}/|PyPI> carries this version."
          # This run verifies the index and nothing else: the tap completes
          # later, in another repository, and posts its own result here. The
          # headline therefore names the channel it checked rather than
          # calling the release done while a channel's outcome is unknown.
          PENDING="The Homebrew tap updates separately and reports its own result to this channel."

          # printf rather than embedded literal newlines so every line of
          # the run: block scalar stays at one indent (YAML doesn't allow
          # zero-indented continuation lines inside a `|` block).
          if [ "$PR_FOUND" = "true" ]; then
            MSG=$(printf '%s\n\n%s\n%s\n%s\n%s' \
              ":white_check_mark: *elspais v${VERSION} published to PyPI*" \
              "${PUBLISHED}" \
              "${PENDING}" \
              "*PR:* <${PR_URL}|#${PR_NUM} ${PR_TITLE}>" \
              "*Run:* <${RUN_URL}|View run>")
          else
            MSG=$(printf '%s\n\n%s\n%s\n%s' \
              ":white_check_mark: *elspais v${VERSION} published to PyPI*" \
              "${PUBLISHED}" \
              "${PENDING}" \
              "*Run:* <${RUN_URL}|View run>")
          fi

          # Multiline output via heredoc — the shared slack-notify action
          # receives `text` as a plain string input, so it needs real
          # newlines (not the literal "\n" the old YAML-payload path
          # relied on).
          {
            echo "text<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        # Pinned to current hht_workflows main. Bot scopes required:
        # chat:write, channels:read, channels:join, bookmarks:read,
        # bookmarks:write.
        uses: Cure-HHT/hht_workflows/.github/actions/slack-notify@bfe3d57b66429f300d11496b541c91d2934ceada
        with:
          event: release-success
          text: ${{ steps.message.outputs.text }}
          bookmark-title: elspais latest release
          slack-token: ${{ secrets.SLACK_APP_OATH_TOKEN }}

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [gate, tests, publish, update-homebrew]
    if: >-
      always() && (needs.gate.result == 'failure' || needs.tests.result == 'failure' ||
      needs.publish.result == 'failure' || needs.update-homebrew.result == 'failure')
    permissions:
      contents: read

    steps:
      # The gate can fail before it resolves a version or a commit, so each
      # falls back to what the trigger named.
      - name: Extract version
        id: version
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GATE_SHA: ${{ needs.gate.outputs.sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          VERSION="${GATE_VERSION:-${INPUT_VERSION:-${RELEASE_TAG#v}}}"
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "sha=${GATE_SHA:-${TRIGGER_SHA}}" >> "$GITHUB_OUTPUT"

      - name: Determine failed steps
        id: failures
        run: |
          FAILED=""
          if [ "${{ needs.gate.result }}" = "failure" ]; then
            FAILED="Release gate"
          fi
          if [ "${{ needs.tests.result }}" = "failure" ]; then
            [ -n "$FAILED" ] && FAILED="$FAILED and "
            FAILED="${FAILED}Release tests"
          fi
          if [ "${{ needs.publish.result }}" = "failure" ]; then
            [ -n "$FAILED" ] && FAILED="$FAILED and "
            FAILED="${FAILED}PyPI publish"
          fi
          if [ "${{ needs.update-homebrew.result }}" = "failure" ]; then
            [ -n "$FAILED" ] && FAILED="$FAILED and "
            FAILED="${FAILED}Homebrew update"
          fi
          echo "failed_steps=${FAILED}" >> "$GITHUB_OUTPUT"

      - name: Find triggering PR author
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if ! PR_JSON=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" --jq '.[0] // empty'); then
            echo "::warning::Pull request lookup for ${SHA} failed (tolerated: the message omits the pull request)"
            PR_JSON=""
          fi

          if [ -n "$PR_JSON" ]; then
            {
              echo "number=$(echo "$PR_JSON" | jq -r '.number')"
              echo "title=$(echo "$PR_JSON" | jq -r '.title')"
              echo "url=$(echo "$PR_JSON" | jq -r '.html_url')"
              echo "author=$(echo "$PR_JSON" | jq -r '.user.login')"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lookup Slack user (PR author) for DM
        id: slack_user
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_APP_OATH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_FOUND: ${{ steps.pr.outputs.found }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          COMMIT_SHA: ${{ steps.version.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Resolve a usable email: PR author profile → commit author →
          # workflow actor profile. Skip noreply addresses (e.g. bots).
          EMAIL=""
          if [ "$PR_FOUND" = "true" ]; then
            EMAIL=$(gh api "users/${PR_AUTHOR}" --jq '.email // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$EMAIL" ] || echo "$EMAIL" | grep -q 'noreply'; then
            EMAIL=$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}" \
              --jq '.commit.author.email // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$EMAIL" ] || echo "$EMAIL" | grep -q 'noreply'; then
            EMAIL=$(gh api "users/${ACTOR}" --jq '.email // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$EMAIL" ] || echo "$EMAIL" | grep -q 'noreply'; then
            echo "::warning::No usable email for PR author / commit author / actor; failure DM not sent"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLACK_RESPONSE=$(curl -s -H "Authorization: Bearer ${SLACK_TOKEN}" \
            "https://slack.com/api/users.lookupByEmail?email=${EMAIL}")

          if [ "$(echo "$SLACK_RESPONSE" | jq -r '.ok')" = "true" ]; then
            echo "user_id=$(echo "$SLACK_RESPONSE" | jq -r '.user.id')" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            ERR=$(echo "$SLACK_RESPONSE" | jq -r '.error // "unknown"')
            echo "::warning::Slack user lookup failed for ${EMAIL}: ${ERR}; failure DM not sent"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build failure message
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FOUND: ${{ steps.pr.outputs.found }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
          VERSION: ${{ steps.version.outputs.version }}
          FAILED_STEPS: ${{ steps.failures.outputs.failed_steps }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          HOMEBREW_RESULT: ${{ needs.update-homebrew.result }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          # Surface the partial-success half so the DM tells the author
          # what did ship in addition to what didn't — a Homebrew failure
          # alone shouldn't hide that PyPI is already live.
          SUCCEEDED=""
          if [ "$PUBLISH_RESULT" = "success" ] && [ "$HOMEBREW_RESULT" != "success" ]; then
            SUCCEEDED="PyPI publish — v${VERSION} is live"
          elif [ "$HOMEBREW_RESULT" = "success" ] && [ "$PUBLISH_RESULT" != "success" ]; then
            SUCCEEDED="Homebrew update dispatched"
          fi
          SUCCEEDED_LINE=""
          [ -n "$SUCCEEDED" ] && SUCCEEDED_LINE="\n*Succeeded:* ${SUCCEEDED}"

          # PR fields are only populated when a PR was found via the
          # commit-SHA lookup. Branch the message so a non-PR trigger
          # (release/workflow_dispatch/workflow_call) doesn't render an
          # empty "*PR:* <|#> " line; fall back to "Triggered by" with
          # the actor's display name in that case.
          if [ "$PR_FOUND" = "true" ]; then
            MSG=":rotating_light: *Publish failed* for elspais v${VERSION}\n\n*Failed:* ${FAILED_STEPS}${SUCCEEDED_LINE}\n*PR:* <${PR_URL}|#${PR_NUM} ${PR_TITLE}>\n*Run:* <${RUN_URL}|View failed run>"
          else
            ACTOR_NAME=$(gh api "users/${ACTOR}" --jq '.name // empty' 2>/dev/null || echo "")
            ACTOR_NAME="${ACTOR_NAME:-${ACTOR}}"
            MSG=":rotating_light: *Publish failed* for elspais v${VERSION}\n\n*Failed:* ${FAILED_STEPS}${SUCCEEDED_LINE}\n*Run:* <${RUN_URL}|View failed run>\n*Triggered by:* ${ACTOR_NAME}"
          fi

          echo "text=${MSG}" >> "$GITHUB_OUTPUT"

      # DMs target a user ID, not a channel name — the shared
      # slack-notify action only routes named channels, so failure DMs
      # stay on slackapi/slack-github-action. The slackapi action parses
      # the `payload:` block as YAML; literal `\n` in the double-quoted
      # YAML string is interpreted as a newline.
      - name: Send failure DM
        if: steps.slack_user.outputs.found == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_APP_OATH_TOKEN }}
          errors: true
          payload: |
            channel: "${{ steps.slack_user.outputs.user_id }}"
            text: "${{ steps.message.outputs.text }}"
