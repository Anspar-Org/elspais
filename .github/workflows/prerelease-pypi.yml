# Implements: REQ-o00081-A+B+C+D, REQ-o00080-E
name: Pre-release to PyPI

# Each automain commit whose CI push run passed is published to PyPI as the
# developmental release X.Y.Z.devN (REQ-o00081, docs/automain.md), so another
# repository's automain work can pin it before any release. An installer
# selects it only for a requirement that names a pre-release, such as
# `elspais==X.Y.Z.devN`. This is the one publication automain causes: it
# makes no tag, no GitHub release and no Homebrew update, and it announces
# nothing (REQ-o00080-E).
#
# The job reads the publishing credential, so it runs no code from the
# automain commit (REQ-o00081-D). CI's `prerelease-build` job built the
# package without the credential. Here the version tool and the lock come
# from main, the commit is read as data (its declared version, its history),
# and the built files are published only where their metadata carries the
# version computed here.
#
# GitHub reads a `workflow_run` workflow from the default branch, so this file
# takes effect once main carries it. It has no other trigger: nobody starts a
# pre-release by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [automain]

permissions: {}

# One run per commit. N fixes each commit's version, so runs for different
# commits need no order and never wait for or cancel one another. A run is
# never cancelled part-way through an upload.
concurrency:
  group: prerelease-pypi-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Publish Pre-release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automain'
    runs-on: ubuntu-latest
    # PYPI_TOKEN lives in the `publish` environment, whose deployment policy
    # admits main and release tags alone. A workflow_run job runs at main, so
    # it qualifies, and a workflow file on automain cannot read the token.
    environment: publish
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # download the package from the CI run

    steps:
      - name: Check out the version tool from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: tool
          persist-credentials: false

      # Data only: nothing in this checkout is executed.
      - name: Check out the commit to read
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: commit
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm automain contains the commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git -C commit merge-base --is-ancestor "$SHA" origin/automain; then
            echo "::error::Refusing to publish ${SHA}: automain does not contain it"
            exit 1
          fi
          echo "automain contains ${SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install publishing tools
        run: pip install -c tool/requirements/dev.lock packaging pkginfo twine

      # The version is computed from what the package index lists now, so a
      # number it carries or carried is refused rather than used twice
      # (REQ-o00081-C).
      - name: Compute the pre-release version
        id: version
        working-directory: tool
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          COUNT=$(git -C ../commit rev-list --count --first-parent "$SHA")
          INDEX="${RUNNER_TEMP}/pypi-elspais.json"
          curl -fsS --retry 3 -o "$INDEX" https://pypi.org/pypi/elspais/json
          VERSION=$(python -m tools.prerelease_version \
            --pyproject ../commit/pyproject.toml --index "$INDEX" --count "$COUNT")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${SHA} as elspais ${VERSION}"

      - name: Download the package CI built
        uses: actions/download-artifact@v4
        with:
          name: prerelease-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The files came from a job that ran the commit's code, so each one is
      # read as data and must carry exactly the version computed above, which
      # is a developmental release (REQ-o00081-B).
      - name: Check the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          twine check dist/*
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import pkginfo
          from packaging.version import Version

          expected = os.environ["VERSION"]
          if not Version(expected).is_devrelease:
              sys.exit(f"::error::{expected} is not a developmental release")
          files = sorted(Path("dist").iterdir())
          wanted = {f"elspais-{expected}-py3-none-any.whl", f"elspais-{expected}.tar.gz"}
          if {f.name for f in files} != wanted:
              sys.exit(f"::error::dist holds {[f.name for f in files]}, not {sorted(wanted)}")
          for f in files:
              reader = pkginfo.Wheel if f.suffix == ".whl" else pkginfo.SDist
              meta = reader(str(f))
              if meta.name != "elspais" or meta.version != expected:
                  sys.exit(f"::error::{f.name} declares {meta.name} {meta.version}, not elspais {expected}")
          print(f"dist holds elspais {expected} and nothing else")
          PY

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
