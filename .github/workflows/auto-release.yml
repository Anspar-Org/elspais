name: Auto Release

# A release starts from CI's verdict, not from the merge: the push run on main
# is the one that runs the full test suite on every supported Python, so the
# release waits for it and publishes the commit it tested. Merging the next
# pull request while that run is in progress does not change what is
# released.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write    # create the tag and the release
  actions: read      # publish-pypi.yml's gate reads CI runs
  packages: write    # publish-pypi.yml can run CI, which builds its image
  pull-requests: read
  id-token: write    # required by publish-pypi.yml's publish job

jobs:
  release:
    name: Create Release

    # Implements: REQ-o00066-N
    # Only a push run on main that concluded success can start a release, and
    # the release targets the commit that run tested.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.create_release.outputs.released }}
      sha: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Find the merged pull request and its publish label
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_JSON=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | .[0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "No merged pull request into main names ${SHA}; nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          if echo "$PR_JSON" | jq -e '[.labels[].name] | index("publish")' >/dev/null; then
            echo "Pull request #${NUMBER} carries the publish label; releasing ${SHA}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request #${NUMBER} does not carry the publish label; nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pr.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get version
        if: steps.pr.outputs.publish == 'true'
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      # The checkout holds one commit and no tags, so the forge is asked.
      - name: Check if tag already exists
        if: steps.pr.outputs.publish == 'true'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists, skipping"
          elif [ "$rc" -eq 2 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist, will create release"
          else
            echo "::error::Could not list tags on origin (git ls-remote exit ${rc})"
            exit "$rc"
          fi

      - name: Extract changelog entry
        if: steps.pr.outputs.publish == 'true' && steps.tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the changelog section for this version
          # Matches from ## [VERSION] to the next ## [ or end of file
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi

          # Write to file to preserve formatting
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.pr.outputs.publish == 'true' && steps.tag.outputs.exists == 'false'
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --target "${SHA}"
          echo "Created release v${VERSION} at ${SHA}"
          echo "released=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: [release]
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish-pypi.yml
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
    secrets: inherit
