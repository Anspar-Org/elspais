name: TIA Calibration

# Empirical check of Test Impact Analysis (docs/test-impact-analysis.md).
# Not part of PR CI: it runs the complete unit tier (twice the cost of one
# PR run) and probes seeded faults, so it runs nightly and on demand.
#
# 1. Restores the previous baseline main recorded, then runs the full unit
#    tier on main's head, recording a fresh baseline. The full run's JUnit
#    is the reference.
# 2. Real-change comparison: the selection from the PREVIOUS baseline (the
#    change = everything merged since) is run and compared with the full run
#    of the same revision. A failing test TIA did not select is a miss.
# 3. Mutant probes against the FRESH baseline: N seeded single-function
#    faults; for each, the tests TIA did not select are run, and any failure
#    among them is a miss.
# The job fails on any miss, and the report is uploaded either way.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      mutants:
        description: "Number of seeded fault probes"
        default: "8"

# The job only reads the repository. The Actions cache and artifact steps
# authenticate with the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  calibrate:
    name: TIA calibration
    runs-on: ubuntu-latest
    container: ghcr.io/anspar-org/elspais-ci:py3.13
    timeout-minutes: 180
    env:
      # The cache, the probes and the report all read the baseline here.
      ELSPAIS_TIA_BASELINE: .results/tia/baseline

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,all]"

      - name: Restore the previous baseline
        uses: actions/cache/restore@v4
        with:
          path: .results/tia/baseline
          key: tia-baseline-v1-py3.13-${{ github.sha }}
          restore-keys: tia-baseline-v1-py3.13-

      - name: Keep it aside
        run: |
          if [ -f .results/tia/baseline/baseline.json ]; then
            mv .results/tia/baseline .results/tia/previous-baseline
          fi

      # A failing test is data for the comparison, not a reason to stop. The
      # tier publishes a baseline only from a run that passed outright, which
      # keeps a failing run from replacing the baseline pull requests select
      # from. Calibration measures this revision as it is, so where the tier
      # published none it builds one from the same run's recording.
      - name: Full unit tier, recording a fresh baseline
        env:
          ELSPAIS_TIA_RECORD: "1"
        run: |
          rc=0
          .githooks/run-unit-tier .results/elspais-unit || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::The unit tier did not complete (exit ${rc})"
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning::Some unit tests failed on this revision (tolerated: they are data for the comparison)"
          fi
          if [ ! -f "$ELSPAIS_TIA_BASELINE/baseline.json" ]; then
            python -m tools.tia baseline build \
              --run-dir .results/elspais-unit/tia-shards --coverage .results/elspais-unit/.coverage
          fi

      - name: Real-change comparison (previous baseline vs this revision)
        if: ${{ hashFiles('.results/tia/previous-baseline/baseline.json') != '' }}
        run: |
          python -m tools.tia calibrate --baseline .results/tia/previous-baseline \
            --full-junit .results/elspais-unit/junit.xml --out .results/tia/calibration-real

      - name: Mutant probes (fresh baseline)
        if: ${{ !cancelled() }}
        run: |
          python -m tools.tia calibrate --baseline .results/tia/baseline \
            --full-junit .results/elspais-unit/junit.xml --out .results/tia/calibration-mutants \
            --mutants "${{ github.event.inputs.mutants || '8' }}" --seed "${{ github.run_number }}"

      - name: Upload calibration reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tia-calibration
          path: |
            .results/tia/calibration-real/calibration.json
            .results/tia/calibration-mutants/calibration.json
            .results/tia/baseline/baseline.json
          if-no-files-found: warn
