# elspais configuration - Core Repository
#
# Tip: Create .elspais.local.toml alongside this file for developer-local
# overrides (e.g. associate paths). It is deep-merged and gitignored.

# Config schema version (do not change)
version = 5
# Daemon TTL in minutes (>0 = auto-start, 0 = disabled, <0 = no timeout)
cli_ttl = 30
# File path for MCP tool-usage statistics (empty = disabled)
stats = ""

# Project identity
[project]
# Prefix for requirement IDs (e.g. REQ -> REQ-p00001)
namespace = "REQ"
# Project display name
name = "elspais"

# Requirement ID format and type definitions
[id-patterns]
# ID template; vars: {namespace}, {level.letter}, {component}
canonical = "{namespace}-{level.letter}{component}"

# Named shorthand patterns for ID matching
[id-patterns.aliases]
short = "{level.letter}{component}"

# Component (numeric part) of the ID
[id-patterns.component]
# "numeric" | "alphanumeric" | "named"
style = "numeric"
# Number of digits in numeric components
digits = 5
# Pad numeric components with leading zeros
leading_zeros = true
# Regex pattern (empty = not applicable for numeric style)
pattern = ""

# Assertion label format
[id-patterns.assertions]
# "uppercase" (A,B,C) | "numeric" (0,1,2) | "numeric_1based" (1,2,3) | "alphanumeric"
label_style = "uppercase"
# Maximum number of assertions per requirement
max_count = 26
# Pad numeric assertion labels with leading zero
zero_pad = false
# Separator for multi-assertion refs (e.g. "+" -> A+B+C)
multi_separator = "+"

# Associated (cross-repo) prefix formatting
[id-patterns.associated]
# Enable associated prefix in IDs
enabled = false
# "after_prefix" | "before_prefix"
position = "after_prefix"
# "uppercase" | "lowercase"
format = "uppercase"
# Length of associated prefix code
length = 3
# Separator between associated prefix and rest of ID
separator = "-"

# Requirement hierarchy levels (name -> config)
[levels.prd]
# Numeric rank (1 = highest, e.g. PRD)
rank = 1
# Single letter used in IDs (e.g. p -> REQ-p00001)
letter = "p"
# Human-readable name for reports
display_name = "Product"
# Which levels this level can implement (list of level names)
implements = ["prd"]

[levels.ops]
rank = 2
letter = "o"
display_name = "Operations"
implements = ["ops", "prd"]

[levels.dev]
rank = 3
letter = "d"
display_name = "Development"
implements = ["dev", "ops", "prd"]

# File scanning configuration
[scanning]
# Global skip patterns (applied to all scan kinds)
skip = ["node_modules", ".git", "__pycache__", "*.pyc", ".venv", ".env"]

# Spec file scanning
[scanning.spec]
# Directories to scan for spec files
directories = ["spec"]
# Glob patterns for spec files
file_patterns = ["*.md"]
# Filenames to skip in spec directories
skip_files = ["README.md", "requirements-format.md", "INDEX.md"]
# Subdirectories to skip in spec directories
skip_dirs = ["_generated"]
# Index file for ordering (empty = no index)
index_file = ""

# Code file scanning
[scanning.code]
# Directories to scan for code files
directories = ["src", ".github/workflows"]
# Glob patterns for code files (empty = the built-in defaults for this kind)
file_patterns = []
# Filenames to skip in code directories
skip_files = []
# Subdirectories to skip in code directories
skip_dirs = []
# Import resolution roots
source_roots = ["src", ""]

# Test file scanning and reference detection
[scanning.test]
# Enable test file scanning
enabled = true
# Directories to scan for test files
directories = ["tests"]
# Glob patterns for test files
file_patterns = ["test_*.py", "*_test.py"]
# Filenames to skip in test directories
skip_files = []
# Subdirectories to skip in test directories
skip_dirs = ["fixtures"]
# External command for function detection (receives paths on stdin, outputs JSON)
prescan_command = ""
# Additional regex patterns for reference detection
reference_patterns = []
# Test targets drive result + coverage ingestion ([[scanning.test.targets]]).
# elspais's own suite (.githooks/pre-commit) runs pytest with
# `--cov-context=test` (pytest-cov's per-test dynamic context), which writes
# coverage.py's native `.coverage` SQLite data file to the repo root. Per-test
# line attribution (code_tested.direct, CUR-1568) is read directly from that
# database via coverage.py's public API (elspais[coverage] extra). Pass/fail
# results come from the same run's JUnit XML (`junit_family=xunit1` keeps the
# per-testcase file/line attributes the source matcher binds on); the hook
# writes both artifacts, and `command` reproduces that run for
# `elspais checks --run-tests`. `Verifies:` wiring for Python tests comes
# from source-scanned `# Verifies:` comments, independent of this target.
# Test target groups (REQ-d00283). A group says which targets a run is about,
# because the targets are not alike in what they cost. A description is
# required: a keyword alone does not tell a newcomer whether their change
# should have run it.
#
# `all` and `default` are reserved and cannot be declared. A target claiming no
# group falls in `default`, so `elspais-unit` claims `default` EXPLICITLY
# alongside `commit` — otherwise grouping it would empty the set a bare
# `elspais checks --run-tests` executes.
[scanning.test.groups]
commit = "Fast enough to gate a commit (~6m). What .githooks/pre-commit runs."
push = "Subprocess and browser tiers, for before a push (~15m). Needs the browser extra."
stress = "Concurrency battery racing live daemon surfaces. Run when mcp/, server/ or graph mutation code changes."

[[scanning.test.targets]]
name = "elspais-unit"
command = "pytest tests/ -q --junitxml=.results/junit.xml -o junit_family=xunit1"
reporter = "junit"
results = ".results/junit.xml"
coverage = ".coverage"
groups = ["commit", "default"]

# The slower tiers, so their PASS/FAIL reaches a coverage figure. Their
# `Verifies:` citations were always source-scanned and so always counted toward
# Tested; without a target their results never were, leaving an assertion tested
# only by an e2e test reading as awaiting-a-result rather than passing.
#
# Each carries `--no-cov` deliberately. `addopts` in pyproject.toml turns on
# `--cov=src/elspais`, so without it every one of these runs would rewrite the
# `.coverage` database that `elspais-unit` reads its per-test line attribution
# from, and the last tier to finish would decide what the whole repo's line
# coverage looked like. Results only here; line attribution stays the unit
# target's job.
[[scanning.test.targets]]
name = "elspais-e2e"
command = "pytest -m e2e -q --no-cov --junitxml=.results/junit-e2e.xml -o junit_family=xunit1"
reporter = "junit"
results = ".results/junit-e2e.xml"
groups = ["push"]

# 34 of the browser tier's 41 tests also carry `e2e`, so this target and
# `elspais-e2e` overlap by design. Both belong to `push`, and a result matched
# twice is the same result; what matters is that the 7 browser-only tests reach
# a figure at all.
[[scanning.test.targets]]
name = "elspais-browser"
command = "pytest -m browser -q --no-cov --junitxml=.results/junit-browser.xml -o junit_family=xunit1"
reporter = "junit"
results = ".results/junit-browser.xml"
groups = ["push"]

[[scanning.test.targets]]
name = "elspais-stress"
command = "pytest tests/stress -m stress -q --no-cov --junitxml=.results/junit-stress.xml -o junit_family=xunit1"
reporter = "junit"
results = ".results/junit-stress.xml"
groups = ["stress"]

# User journey file scanning
[scanning.journey]
# Directories to scan for journey files
directories = ["spec"]
# Glob patterns for journey files
file_patterns = ["*.md"]
# Filenames to skip in journey directories
skip_files = []
# Subdirectories to skip in journey directories
skip_dirs = []

# Documentation file scanning
[scanning.docs]
# Directories to scan for documentation
directories = ["docs"]
# Glob patterns for doc files
file_patterns = ["*.md"]
# Filenames to skip in docs directories
skip_files = []
# Subdirectories to skip in docs directories
skip_dirs = []

# Validation rules
[rules]
# Branches where viewer edit mode is disabled (exact names or globs)
protected_branches = ["main", "master"]
# Content validation rules (list of rule module paths)
content_rules = []

# Hierarchy validation settings
[rules.hierarchy]
# Allow circular requirement references
allow_circular = false
# Allow nodes without a FILE ancestor
allow_structural_orphans = false
# Allow implements edges across repos
cross_repo_implements = false
# Allow orphaned nodes in the graph
allow_orphans = false

# Format enforcement rules
[rules.format]
# Require content hash in requirement footer
require_hash = true
# Require Rationale section in requirements
require_rationale = false
# Require at least one assertion per requirement
require_assertions = true
# Require Status field in requirement metadata
require_status = true
# "warning" | "info" -- severity for REQs with no assertions
no_assertions_severity = "warning"
# "warning" | "info" -- severity for code/test files with no REQ markers
no_traceability_severity = "info"

# Status role classification (determines behavior in metrics/viewer)
[rules.format.status_roles]
# Committed, normative -- counted in all metrics
active = ["Active"]
# In-progress toward active -- excluded from coverage
provisional = ["Draft", "Proposed"]
# Future/planning -- excluded from coverage and analysis
aspirational = ["Roadmap", "Future"]
# Concluded -- excluded from everything, hidden by default
retired = ["Deprecated", "Superseded"]

[rules.coverage]

# Coverage severity tiers per dimension (ok | info | warning | error)
# Code implements assertions
[rules.coverage.implemented]
# All assertions covered
full = "off"
# Some assertions covered, some not
partial = "warning"
# Has coverage but test results show failures
failing = "error"
# No coverage at all
missing = "error"

# Tests reference assertions
[rules.coverage.tested]
full = "off"
partial = "warning"
failing = "error"
missing = "error"

# Test results exist for assertions
[rules.coverage.verified]
full = "off"
partial = "warning"
failing = "error"
missing = "warning"

# User journeys validate assertions
[rules.coverage.uat_coverage]
full = "off"
partial = "info"
failing = "error"
missing = "info"

# User journey results exist
[rules.coverage.uat_verified]
full = "off"
partial = "info"
failing = "error"
missing = "info"

# Severity for code/test references to non-active requirements
[rules.references]
# "off" | "info" | "warning" | "error" -- refs to Deprecated/Superseded/Rejected
retired = "warning"
# "off" | "info" | "warning" | "error" -- refs to Draft/Proposed
provisional = "info"
# "off" | "info" | "warning" | "error" -- refs to Roadmap/Future/Idea
aspirational = "info"
# "off" | "info" | "warning" | "error" -- a comment citing a requirement in
# prose without a keyword. This estate writes those deliberately, so the
# findings are listed without failing the run.
undeclared = "info"

# Changelog enforcement for requirement changes
[changelog]
# Track current content hash in changelog entries
hash_current = true
# Require changelog section in requirements
present = false
# "gh" (GitHub) | "env" | "manual" -- source for author IDs
id_source = "gh"
# "iso" (YYYY-MM-DD) | "us" (MM/DD/YYYY) | "eu" (DD/MM/YYYY)
date_format = "iso"
# "email" | "username" | "full_name"
author_id_format = "email"
# "all" or list of allowed author identifiers
allowed_author_ids = "all"

# Which changelog fields are mandatory
[changelog.require]
# Require a reason for each change
reason = true
# Require author name in changelog entries
author_name = true
# Require author ID in changelog entries
author_id = true
# Require changes in chronological order
change_order = false

# Keyword extraction settings
[keywords]
# Minimum word length for keyword extraction
min_length = 3

# Hash and validation settings
[validation]
# "normalized-text" -- how requirement content is hashed
hash_mode = "normalized-text"
# Hash algorithm
hash_algorithm = "sha256"
# Hash truncation length in chars
hash_length = 8
# Strict hierarchy validation mode
strict_hierarchy = false

# Defined terms: glossary, index, and health checks
[terms]
# Directory for generated glossary and index files
output_dir = "spec/_generated"
# Markup styles recognized as term references
markup_styles = ["*", "**"]
# Files excluded from term scanning
exclude_files = []

# Severity levels for defined-terms health checks
[terms.severity]
# Duplicate term definitions
duplicate = "error"
# References to undefined terms
undefined = "info"
# Unmarked usages of defined terms
unmarked = "info"
# Defined terms with no references
unused = "warning"
# Malformed term definitions
bad_definition = "error"
# Empty collection terms
collection_empty = "warning"
# Non-canonical form usage
canonical_form = "info"

# Output settings
[output]
# Output format list (e.g. ["json", "csv"])
formats = []
# Directory for generated output files
dir = ""

#──────────────────────────────────────────────────────────────────────────────
# SCOPES - Named Report Selections
#──────────────────────────────────────────────────────────────────────────────

# The product-level view a stakeholder reads, with withdrawn requirements out of
# the way. Used as `elspais trace --scope overview`.
[scopes.overview]
level = ["prd"]
not_status = ["Deprecated", "Superseded"]
# The facts a stakeholder overview states: whether the work is built, tested and
# passing. Value keys, not display words -- renaming a display label leaves this
# declaration standing.
#
# Deliberately names no identity value. Every report already states what each of
# its rows is about, and which value that is differs by report: the per-requirement
# report says which requirement, the coverage summary says which level. A
# declaration naming `id` would be unusable by a report whose rows are not
# requirements.
values = ["implemented", "tested", "verified"]
